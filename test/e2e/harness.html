<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>tsr harness</title>
<style>
  body { margin: 0; padding: 24px; background: #fff; }
  #out { width: 300px; }
</style>
</head>
<body>
<div id="out"></div>
<script type="module">
import { createEngine } from '/runtime/src/main/shell.mjs';
import { auditTypeset } from '/runtime/src/main/audit.mjs';
import { contentTextFromRange } from '/runtime/src/main/copy.mjs';

const engine = createEngine();
const out = document.getElementById('out');
let handle = null;

window.__tsr = {
  async typeset(source, opts = {}) {
    if (opts.widthPx) out.style.width = opts.widthPx + 'px';
    // collectUpgrades: every onUpgrade batch lands in window.__ups (plan P3-05)
    if (opts.collectUpgrades) {
      window.__ups = [];
      opts = { ...opts, onUpgrade: (u) => window.__ups.push(u) };
    }
    handle = await engine.typeset(source, out, opts);
    return { diags: handle.diags, heightPx: handle.heightPx, dpr: devicePixelRatio,
             hasSemantic: !!handle.semanticHtml, upgrades: handle.upgrades.length,
             html: handle.html };
  },
  async update(source) {
    const r = await handle.update(source);
    return { diags: r.diags, heightPx: r.heightPx, timings: r.timings,
             upgrades: r.upgrades.length, patched: r.patched,
             html: document.getElementById('out').innerHTML };
  },
  async relayout(widthPx) {
    out.style.width = widthPx + 'px';
    const r = await handle.relayout(widthPx);
    return { heightPx: r.heightPx, upgrades: r.upgrades.length, html: r.html, timings: r.timings };
  },
  async paginate(opts) {
    return await handle.paginate(opts);
  },
  // (plan P3-05) the commit session's view: block pids and keys; and a
  // dropped body, so the next result names a key the shell no longer holds
  held() {
    return handle.session.blocks.map((b) => ({ pid: b.pid, key: b.key }));
  },
  forgetHeld(i = 0) {
    handle.session.bodies.delete(handle.session.blocks[i].key);
  },
  copyText() {
    const range = document.createRange();
    range.selectNodeContents(out);
    return contentTextFromRange(range, out);
  },
  audit() {
    return auditTypeset(out);
  },
};
window.__tsrReady = true;
</script>
</body>
</html>
