<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TeX-Grade Web Typesetter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #faf8f5;
    --fg: #2c2420;
    --accent: #8b4513;
    --muted: #9a8e82;
    --border: #e0d8cf;
    --editor-bg: #f5f2ee;
    --content-width: 300px;
  }

  body {
    font-family: 'Crimson Text', Georgia, serif;
    font-size: 18px;
    line-height: 1.5;
    color: var(--fg);
    background: var(--bg);
  }

  .page {
    max-width: 1200px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0;
    min-height: 100vh;
  }

  .editor-pane {
    border-right: 1px solid var(--border);
    padding: 40px 30px;
    display: flex;
    flex-direction: column;
    position: sticky;
    top: 0;
    height: 100vh;
  }

  .editor-pane h1 {
    font-size: 16px;
    font-weight: 400;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--muted);
    margin-bottom: 8px;
  }

  .editor-pane .subtitle {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 20px;
    font-family: 'JetBrains Mono', monospace;
  }

  .controls {
    display: flex;
    gap: 12px;
    margin-bottom: 16px;
    align-items: center;
    flex-wrap: wrap;
  }

  .controls label {
    font-size: 13px;
    font-family: 'JetBrains Mono', monospace;
    color: var(--muted);
  }

  .controls input[type="range"] { width: 120px; }

  .controls button {
    padding: 6px 18px;
    background: var(--accent);
    color: white;
    border: none;
    font-family: 'Crimson Text', serif;
    font-size: 15px;
    cursor: pointer;
    letter-spacing: 0.5px;
  }

  .controls button:hover { background: #6d3610; }

  #editor {
    flex: 1;
    resize: none;
    border: 1px solid var(--border);
    background: var(--editor-bg);
    padding: 20px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    line-height: 1.7;
    color: var(--fg);
    outline: none;
    tab-size: 2;
  }

  #editor:focus { border-color: var(--accent); }

  .render-pane {
    padding: 60px 40px;
    overflow-y: auto;
    height: 100vh;
  }

  #output { max-width: var(--content-width); margin: 0 auto; }

  .typeset-paragraph { margin-bottom: 1.2em; }
  .typeset-line { text-indent: 0; }

  .typeset-dropcap { color: var(--accent) !important; }

  .status-bar {
    padding: 8px 0;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    border-top: 1px solid var(--border);
    margin-top: 12px;
  }

  .comparison {
    margin-top: 30px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
  }

  .comparison h2 {
    font-size: 13px;
    font-weight: 400;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--muted);
    margin-bottom: 12px;
  }

  #output-naive {
    max-width: var(--content-width);
    margin: 0 auto;
    font-family: 'Crimson Text', Georgia, serif;
    font-size: 18px;
    line-height: 1.5;
    color: var(--fg);
    text-align: justify;
  }

  #output-naive p {
    margin-bottom: 1.2em;
    hyphens: auto;
    -webkit-hyphens: auto;
  }

  @media (max-width: 900px) {
    .page { grid-template-columns: 1fr; }
    .editor-pane { position: relative; height: auto; min-height: 400px; }
    .render-pane { height: auto; }
  }
</style>
</head>
<body>
<div class="page">
  <div class="editor-pane">
    <h1>TeX-Grade Web Typesetter</h1>
    <div class="subtitle">Knuth–Plass line breaking for the web</div>
    <div class="controls">
      <label>Width: <span id="width-val">300</span>px</label>
      <input type="range" id="width-slider" min="150" max="800" value="300">
      <button id="typeset-btn">Typeset ↵</button>
    </div>
    <div class="controls" style="flex-wrap: wrap; gap: 8px 16px;">
      <label style="font-size:12px;">Exponent (n): <span id="exp-val">3</span></label>
      <input type="range" id="exp-slider" min="1" max="8" step="0.5" value="3" style="width:90px;">
      <label style="font-size:12px;">Hyphen penalty: <span id="hyp-val">0.70</span></label>
      <input type="range" id="hyp-slider" min="0" max="2" step="0.05" value="0.70" style="width:90px;">
      <label style="font-size:12px;">Shrink threshold: <span id="shrink-val">0.37</span></label>
      <input type="range" id="shrink-slider" min="0" max="0.5" step="0.01" value="0.37" style="width:90px;">
      <label style="font-size:12px;">Shrink coeff (c): <span id="coeff-val">0.6</span></label>
      <input type="range" id="coeff-slider" min="0.5" max="2" step="0.1" value="0.6" style="width:90px;">
    </div>
    <textarea id="editor" spellcheck="false"></textarea>
    <div class="status-bar" id="status">Ready</div>
  </div>
  <div class="render-pane">
    <div id="output"></div>
    <div class="comparison">
      <h2>Browser default justify (comparison)</h2>
      <div id="output-naive"></div>
    </div>
  </div>
</div>

<script id="bundle">%%BUNDLE%%</script>

<script>
var DEFAULT_TEXT = 'The amount of parallelism that can be achieved depends on the maximum size of integers available in the language and the processor. In JavaScript bit-wise operations currently treat all numbers as 32-bit integers. This will hopefully be extended in future via the BigInt proposal. In modern browsers, 64-bit integers are also supported in WebAssembly.';

var editor = document.getElementById('editor');
var output = document.getElementById('output');
var outputNaive = document.getElementById('output-naive');
var widthSlider = document.getElementById('width-slider');
var widthVal = document.getElementById('width-val');
var typesetBtn = document.getElementById('typeset-btn');
var status = document.getElementById('status');

var expSlider = document.getElementById('exp-slider');
var expVal = document.getElementById('exp-val');
var hypSlider = document.getElementById('hyp-slider');
var hypVal = document.getElementById('hyp-val');
var shrinkSlider = document.getElementById('shrink-slider');
var shrinkVal = document.getElementById('shrink-val');
var coeffSlider = document.getElementById('coeff-slider');
var coeffVal = document.getElementById('coeff-val');

editor.value = DEFAULT_TEXT;

widthSlider.addEventListener('input', function() {
  widthVal.textContent = widthSlider.value;
  document.documentElement.style.setProperty('--content-width', widthSlider.value + 'px');
});
expSlider.addEventListener('input', function() { expVal.textContent = expSlider.value; });
hypSlider.addEventListener('input', function() { hypVal.textContent = parseFloat(hypSlider.value).toFixed(2); });
shrinkSlider.addEventListener('input', function() { shrinkVal.textContent = parseFloat(shrinkSlider.value).toFixed(2); });
coeffSlider.addEventListener('input', function() { coeffVal.textContent = parseFloat(coeffSlider.value).toFixed(1); });

async function doTypeset() {
  var text = editor.value;
  var width = parseInt(widthSlider.value);

  var config = {
    costParams: {
      exponent: parseFloat(expSlider.value),
      shrinkThreshold: parseFloat(shrinkSlider.value),
      shrinkCoeff: parseFloat(coeffSlider.value),
    },
    hyphenPenalty: parseFloat(hypSlider.value),
  };

  status.textContent = 'Typesetting...';
  var t0 = performance.now();

  try {
    await Typesetter.typeset(text, output, width, config);
    var elapsed = (performance.now() - t0).toFixed(1);
    status.textContent = 'Done in ' + elapsed + 'ms';
  } catch (e) {
    status.textContent = 'Error: ' + e.message;
    console.error(e);
  }

  // Naive comparison
  outputNaive.innerHTML = '';
  var paragraphs = text.split(/\n\n+/);
  for (var pi = 0; pi < paragraphs.length; pi++) {
    var trimmed = paragraphs[pi].trim();
    if (!trimmed) continue;
    var lines = trimmed.split('\n').filter(function(l) { return !l.trim().startsWith('['); });
    var content = lines.join(' ')
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*(.+?)\*/g, '<em>$1</em>');
    if (content.trim()) {
      var el = document.createElement('p');
      el.innerHTML = content;
      el.style.maxWidth = width + 'px';
      outputNaive.appendChild(el);
    }
  }
}

typesetBtn.addEventListener('click', doTypeset);
editor.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
    e.preventDefault();
    doTypeset();
  }
});

document.fonts.ready.then(function() {
  setTimeout(doTypeset, 100);
});
</script>
</body>
</html>
