name: ci
on:
  push:
  pull_request:

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: configure + build (Debug, ASan/UBSan)
        run: |
          cmake -S engine -B engine/build-debug -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Debug
          cmake --build engine/build-debug -j
      - name: ctest (Debug)
        run: ctest --test-dir engine/build-debug --output-on-failure
      - name: configure + build (Release)
        run: |
          cmake -S engine -B engine/build -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release
          cmake --build engine/build -j
      - name: ctest (Release)
        run: ctest --test-dir engine/build --output-on-failure

  web:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # failure diagnostics ride on the rolling release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: mymindstorm/setup-emsdk@v14
      - name: build native tsrc (recorder dependency)
        run: |
          cmake -S engine -B engine/build -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release
          cmake --build engine/build -j
      - name: build wasm
        run: |
          emcmake cmake -S engine -B engine/build-wasm -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release
          cmake --build engine/build-wasm -j
      - name: npm ci
        run: npm ci --no-audit --no-fund
      - name: ops contract is regenerated
        run: |
          node tools/gen-ops-ts.mjs
          git diff --exit-code runtime/src/shared/ops.gen.mjs
      - name: recordings are current
        run: node tools/record-fixtures.mjs --check
      - name: code highlighting assets
        run: node tools/codehl-assets.mjs
      - name: typst corpus smoke
        run: node tools/corpus-run.mjs
      - name: install chromium
        run: npx playwright install --with-deps chromium
      # a CJK serif with full-width punctuation glyphs, as real readers have;
      # without it “ ” fall back to DejaVu's proportional glyphs and CJK
      # fixtures miss the right edge by ~2px
      - name: install CJK fonts
        run: sudo apt-get install -y --no-install-recommends fonts-noto-cjk && fc-cache -f && fc-match "Noto Serif CJK SC"
      - name: e2e (audit matrix, dsf 1.0/1.25/1.5/2.0)
        run: PLAYWRIGHT_JSON_OUTPUT_NAME=e2e-report.json npx playwright test --reporter=list,json
      - name: fonts on the runner (diagnostics)
        if: always()
        run: |
          { fc-match serif; fc-match "Noto Serif CJK SC"; fc-list --format='%{family}\n' | sort -u | head -60; } > fonts.txt 2>&1 || true
      - name: publish failure diagnostics
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node -e '
            const r = require("./e2e-report.json");
            const out = [];
            const walk = (s) => { for (const t of s.suites ?? []) walk(t); for (const sp of s.specs ?? [])
              for (const t of sp.tests) for (const res of t.results) if (res.status !== "passed" && res.status !== "skipped")
                out.push({ title: sp.title, project: t.projectName, error: (res.error?.message ?? "").slice(0, 1500) }); };
            for (const s of r.suites) walk(s);
            require("fs").writeFileSync("e2e-failures-${{ github.sha }}.txt", JSON.stringify(out, null, 1) + "\n" + require("fs").readFileSync("fonts.txt", "utf8"));
          '
          gh release upload engine-dist "e2e-failures-${{ github.sha }}.txt" --clobber || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/

  # rolling engine distribution (consumed by zball-bz/zball-io): wasm +
  # runtime + hl grammars + math font, published only from a green main
  dist:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [native, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: mymindstorm/setup-emsdk@v14
      - name: build wasm
        run: |
          emcmake cmake -S engine -B engine/build-wasm -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release
          cmake --build engine/build-wasm -j
      - name: npm ci
        run: npm ci --no-audit --no-fund
      - name: code highlighting assets
        run: node tools/codehl-assets.mjs
      - name: pack
        run: node tools/pack-dist.mjs
      # VSCode extension: vendor the same dist, package a .vsix
      - name: package vscode-tsm
        run: |
          node editors/vscode-tsm/scripts/vendor.mjs
          cd editors/vscode-tsm && npx --yes @vscode/vsce package --allow-missing-repository
          ls *.vsix
      - name: publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete engine-dist --yes --cleanup-tag || true
          gh release create engine-dist dist/typesetter-dist.tgz editors/vscode-tsm/*.vsix \
            -t "engine dist + vscode-tsm (rolling)" \
            -n "Built from ${{ github.sha }}. typesetter-dist.tgz is consumed by zball-bz/zball-io; vscode-tsm-*.vsix installs with \`code --install-extension\`."
